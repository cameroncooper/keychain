[package]
name = "keychain-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[[bin]]
name = "keychain-gui"
path = "src/main.rs"

[dependencies]
keychain = { path = ".." }
keychain-sep-driver = { path = "../crates/sep-driver" }
cxx = { version = "=1.0.205", features = ["c++17", "std"] }
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "=0.10.0"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "gui-smoke"
path = "tests/gui-smoke.rs"
harness = false
