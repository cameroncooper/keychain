[package]
name = "keychain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only Apple Passwords client for Linux"
license = "MIT"
publish = false

[workspace]
members = ["crates/sep-driver"]
exclude = ["helpers/mac-anisette"]
resolver = "2"

[features]
desktop-agent = ["dep:gtk4"]

[[bin]]
name = "keychain-auth-agent"
path = "src/bin/keychain-auth-agent.rs"
required-features = ["desktop-agent"]

[dependencies]
keychain-sep-driver = { path = "crates/sep-driver" }
gtk4 = { version = "0.9", optional = true }
zbus = "=4.4.0"
listenfd = "1"
aes = "0.8"
aes-gcm = "0.10"
aes-siv = "0.7"
base64 = "0.22"
cbc = "0.1"
chacha20poly1305 = "0.10"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2"
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
pbkdf2 = "0.12"
plist = "1.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
time = { version = "=0.3.45", features = ["parsing"] }
thiserror = "2"
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
