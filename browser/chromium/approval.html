<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Use a passkey?</title>
    <link rel="stylesheet" href="approval.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">KEYCHAIN PASSKEYS</p>
      <h1>Use a passkey?</h1>
      <p class="site" id="site">Loading request…</p>
      <p class="origin" id="origin"></p>

      <form id="approval-form" hidden>
        <fieldset>
          <legend>Choose an account</legend>
          <div id="accounts"></div>
        </fieldset>
        <p class="notice" id="notice">
          This confirms your presence, but the current software backend cannot claim device user
          verification. Requests that require verification are refused.
        </p>
        <p class="error" id="error" role="alert"></p>
        <div class="actions">
          <button type="button" class="secondary" id="cancel">Cancel</button>
          <button type="submit" class="primary" id="approve">Continue</button>
        </div>
      </form>
    </main>
    <script src="approval.js"></script>
  </body>
</html>
