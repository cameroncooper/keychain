<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keychain — Choose an account</title>
  <link rel="stylesheet" href="approval.css">
</head>
<body class="account-picker">
  <main>
    <header class="menu-heading"><span class="key-mark" aria-hidden="true"></span><span>Keychain</span><button id="cancel" class="quiet" type="button" aria-label="Cancel">Cancel</button></header>
    <div class="site-heading"><h1 id="site">Loading accounts…</h1><p id="origin" class="secondary"></p></div>
    <div id="accounts" class="account-list" aria-label="Choose an account"></div>
    <p id="notice" class="notice">Choose an account to continue.</p>
    <p id="error" class="error" role="alert"></p>
  </main>
  <script src="approval.js"></script>
</body>
</html>
