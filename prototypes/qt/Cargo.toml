[workspace]
members = ["model", "cxxqt", "qtbridge"]
resolver = "2"

[workspace.dependencies]
prototype-model = { path = "model" }
cxx = { version = "=1.0.205", features = ["c++17", "std"] }
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
